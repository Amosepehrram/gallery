<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>گالری کلاس</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f3f7f5;--card:#fff;--ink:#10231f;--mut:#5f766f;--acc:#0f9d7a;--on:#fff;--line:#d3e2dd}
@media(prefers-color-scheme:dark){:root{--bg:#0c1513;--card:#14211e;--ink:#e5f2ee;--mut:#8fa8a0;--acc:#2dd4a7;--on:#06231b;--line:#243833}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 Vazirmatn,Tahoma,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card)}
header b{font-weight:900;font-size:20px}
main{max-width:980px;margin:0 auto;padding:20px}
h2{font-weight:900;margin:0 0 14px}
button,input,textarea{font:inherit;color:inherit}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);margin-bottom:10px}
button{cursor:pointer;border:0;border-radius:8px;padding:9px 16px;background:var(--acc);color:var(--on);font-weight:700}
button.ghost{background:none;color:var(--mut);border:1px solid var(--line)}
#online{color:var(--acc);border-color:var(--acc);margin-inline-end:8px}
button.del{background:none;color:#c0392b;padding:2px 8px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.auth{max-width:380px;margin:8vh auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.album{padding:22px 18px;border-radius:16px;background:var(--card);border:1px solid var(--line);border-inline-start:6px solid var(--acc);cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.photo{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.photo img{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:zoom-in}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:14px}.sheet b{display:inline-block;margin-bottom:6px}.sheet .del{float:left}
label{display:block;font-size:13px;color:var(--mut)}
.row{display:flex;gap:10px;align-items:flex-start;margin-bottom:16px}.row input{margin:0}
.err{color:#c0392b;min-height:24px;font-size:14px}
.empty{color:var(--mut);padding:30px 0;text-align:center}
.chat{height:55vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;padding:6px 12px;border-radius:14px;background:var(--bg);border:1px solid var(--line);word-break:break-word}
.msg small{display:block;color:var(--mut);font-size:12px}
.msg.me{align-self:flex-end;background:var(--acc);color:var(--on);border-color:var(--acc)}
.msg.me small{color:inherit;opacity:.75}
.msg .del{color:inherit;font-size:12px}

main{padding-top:24px}
header b{flex:1;text-align:center}
.ic{background:none;color:var(--ink);font-size:26px;padding:0 8px;line-height:1}
#ov{position:fixed;inset:0;background:#0008;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#dr{position:fixed;top:0;bottom:0;right:0;width:270px;max-width:82vw;background:var(--card);z-index:21;transform:translateX(100%);transition:transform .25s;padding:22px 16px;display:flex;flex-direction:column;gap:4px}
body.open #ov{opacity:1;pointer-events:auto}body.open #dr{transform:none}
#dr .who{display:flex;gap:12px;align-items:center;padding-bottom:18px;margin-bottom:10px;border-bottom:1px solid var(--line)}
#dr small{color:var(--mut)}
#dr .it{background:none;color:var(--ink);text-align:right;font-size:17px;padding:13px 12px;border-radius:12px;width:100%}
#dr .it:hover{background:var(--bg)}
#dr .out{margin-top:auto;color:#d6455d}
.av{display:inline-grid;place-items:center;flex:none;width:34px;height:34px;border-radius:50%;background:linear-gradient(45deg,#f9a03f,#e1306c,#6c5ce7);color:#fff;font-weight:700}
.av.big{width:48px;height:48px;font-size:20px}
.feed{max-width:470px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.photo{border-radius:14px}
.ph{display:flex;align-items:center;gap:10px;padding:10px 12px}
.ph .del{margin-inline-start:auto}
.cap{padding:10px 14px 14px;font-size:15px}
.album{background:linear-gradient(135deg,var(--acc),#6c5ce7);color:#fff;border:0;min-height:110px;font-size:18px;align-items:flex-end}
.album .del{color:#fff;opacity:.85}
#big{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:9}
#big img{max-width:95vw;max-height:95vh}
</style>
</head>
<body>
<div id="app"></div>
<div id="big" onclick="this.style.display='none'"><img alt=""></div>
<script>
// ====== inja do ta meghdar ro az Supabase > Project Settings > API bezar ======
const SUPABASE_URL = "https://dveinkpgdnehsfsyiool.supabase.co";
const SUPABASE_KEY = "sb_publishable_KkK80KPNkVMaMZwFc1rijA_CmAiv6iU";
// ==============================================================================
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $app = document.getElementById("app");
let me = null, mode = "login";
const esc = s => (s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function init() {
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return authView();
    const { data, error } = await sb.from("profiles").select("*").eq("id", session.user.id).single();
    if (error || !data) { await sb.auth.signOut(); return authView(); }
    me = { ...data, id: session.user.id };
    startPresence();
    albumsView();
  } catch (e) {
    $app.innerHTML = `<div class="box auth"><p>اتصال به سرور برقرار نشد.</p><button onclick="location.reload()">تلاش دوباره</button></div>`;
  }
}

// ===== kasai ke online hastan (Supabase Realtime Presence) =====
let ch = null, onlineNames = [];
function startPresence() {
  if (ch) return;
  ch = sb.channel("online", { config: { presence: { key: me.id } } });
  ch.on("presence", { event: "sync" }, () => {
    onlineNames = Object.values(ch.presenceState()).map(a => a[0].name);
    showOnline();
  });
  ch.subscribe(st => { if (st === "SUBSCRIBED") ch.track({ name: me.name }); });
}
function showOnline() {
  const el = document.getElementById("online");
  if (el) el.textContent = "● " + onlineNames.length + " نفر آنلاین";
}

function shell(inner) {
  stopChat();
  document.body.classList.remove("open");
  const ini = esc((me.name || "?")[0]);
  $app.innerHTML = `<header><button class="ic" id="mn" aria-label="منو">☰</button><b>گالری کلاس</b>
    <button class="ghost" id="online" title="لیست آنلاین‌ها"></button></header>
    <div id="ov"></div>
    <aside id="dr"><div class="who"><span class="av big">${ini}</span><div><b>${esc(me.name)}</b><br><small>${me.is_admin ? "ادمین" : "کاربر"}</small></div></div>
      <button class="it" id="na">آلبوم‌ها</button><button class="it" id="nc">چت</button>
      <button class="it out" id="out">خروج</button></aside><main>${inner}</main>`;
  const close = () => document.body.classList.remove("open");
  document.getElementById("mn").onclick = () => document.body.classList.toggle("open");
  document.getElementById("ov").onclick = close;
  showOnline();
  document.getElementById("na").onclick = albumsView;
  document.getElementById("nc").onclick = chatView;
  document.getElementById("online").onclick = () => alert("آنلاین‌ها:\n" + onlineNames.join("\n"));
  document.getElementById("out").onclick = async () => {
    if (ch) { await sb.removeChannel(ch); ch = null; }
    await sb.auth.signOut(); me = null; authView();
  };
}

function authView() {
  const su = mode === "signup";
  $app.innerHTML = `<form class="box auth" id="f"><h2>${su ? "ساخت حساب" : "ورود"}</h2>
    ${su ? `<input id="name" placeholder="نام و نام خانوادگی" required>` : ""}
    <input id="email" type="email" placeholder="ایمیل" required dir="ltr">
    <input id="pass" type="password" placeholder="رمز عبور (حداقل ۶ کاراکتر)" minlength="6" required dir="ltr">
    ${su ? `<input id="invite" placeholder="کد دعوت" required dir="ltr">` : ""}
    <div class="err" id="err"></div>
    <button style="width:100%">${su ? "ثبت‌نام" : "ورود"}</button>
    <p style="text-align:center"><a href="#" id="sw">${su ? "حساب دارم، ورود" : "حساب ندارم، ثبت‌نام با کد دعوت"}</a></p></form>`;
  const err = m => document.getElementById("err").textContent = m;
  document.getElementById("sw").onclick = e => { e.preventDefault(); mode = su ? "login" : "signup"; authView(); };
  document.getElementById("f").onsubmit = async e => {
    e.preventDefault();
    const btn = e.target.querySelector("button"); btn.disabled = true; btn.textContent = "صبر کن...";
    const email = v("email"), password = v("pass");
    let r;
    try {
      const call = su
        ? sb.auth.signUp({ email, password, options: { data: { name: v("name"), invite: v("invite") } } })
        : sb.auth.signInWithPassword({ email, password });
      r = await Promise.race([call, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 20000))]);
    } catch (x) {
      btn.disabled = false; btn.textContent = su ? "ثبت‌نام" : "ورود";
      return err("اتصال به سرور کند است یا قطع است. دوباره امتحان کن (شاید فیلترشکن لازم باشد).");
    }
    btn.disabled = false; btn.textContent = su ? "ثبت‌نام" : "ورود";
    if (r.error) return err(/database error|invite/i.test(r.error.message) ? "کد دعوت اشتباه است" : "خطا: " + r.error.message);
    init();
  };
}
const v = id => document.getElementById(id).value.trim();

// ===== chat room =====
let chatCh = null;
function stopChat() { if (chatCh) { sb.removeChannel(chatCh); chatCh = null; } }
async function chatView() {
  const { data: msgs } = await sb.from("messages").select("*").order("created_at", { ascending: false }).limit(100);
  shell(`<h2>چت</h2><div class="box"><div class="chat" id="chat"></div>
    <form class="row" id="cf" style="margin:12px 0 0"><input id="ci" maxlength="500" placeholder="پیام..." autocomplete="off"><button>ارسال</button></form></div>`);
  const box = document.getElementById("chat");
  const add = m => {
    if (box.querySelector(`[data-m="${m.id}"]`)) return;
    const d = document.createElement("div");
    d.className = "msg" + (m.user_id === me.id ? " me" : "");
    d.dataset.m = m.id;
    d.innerHTML = `<small>${esc(m.user_name)}</small>${esc(m.body)}` +
      (me.is_admin || m.user_id === me.id ? ` <button class="del" data-x="${m.id}">حذف</button>` : "");
    box.appendChild(d); box.scrollTop = box.scrollHeight;
  };
  (msgs || []).reverse().forEach(add);
  box.onclick = async e => { if (e.target.dataset.x) await sb.from("messages").delete().eq("id", e.target.dataset.x); };
  chatCh = sb.channel("chat")
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, p => add(p.new))
    .on("postgres_changes", { event: "DELETE", schema: "public", table: "messages" }, p => box.querySelector(`[data-m="${p.old.id}"]`)?.remove())
    .subscribe();
  document.getElementById("cf").onsubmit = async e => {
    e.preventDefault();
    const t = v("ci"); if (!t) return;
    document.getElementById("ci").value = "";
    const r = await sb.from("messages").insert({ user_id: me.id, user_name: me.name, body: t });
    if (r.error) alert("ارسال نشد");
  };
}

async function albumsView() {
  const { data: albums } = await sb.from("albums").select("*").order("created_at", { ascending: false });
  shell(`<h2>آلبوم‌ها</h2>
    ${me.is_admin ? `<div class="row"><input id="t" placeholder="نام آلبوم جدید، مثلا: امتحان علوم"><button id="add">ساخت</button></div>` : ""}
    <div class="grid">${albums.map(a => `<div class="album" data-id="${a.id}" data-t="${esc(a.title)}"><span>${esc(a.title)}</span>
      ${me.is_admin ? `<button class="del" data-del="${a.id}">حذف</button>` : ""}</div>`).join("") || `<div class="empty">هنوز آلبومی نیست.</div>`}</div>`);
  document.querySelectorAll(".album").forEach(el => el.onclick = e => {
    if (e.target.dataset.del) return;
    photosView(+el.dataset.id, el.dataset.t);
  });
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (!confirm("آلبوم و همه عکس‌هاش حذف بشه؟")) return;
    const { data: ps } = await sb.from("photos").select("path").eq("album_id", b.dataset.del);
    if (ps.length) await sb.storage.from("photos").remove(ps.map(p => p.path));
    await sb.from("albums").delete().eq("id", b.dataset.del);
    albumsView();
  });
  if (me.is_admin) document.getElementById("add").onclick = async () => {
    if (!v("t")) return;
    await sb.from("albums").insert({ title: v("t") });
    albumsView();
  };
}

async function photosView(id, title) {
  const { data: photos } = await sb.from("photos").select("*").eq("album_id", id).order("created_at", { ascending: false });
  const { data: answers } = await sb.from("answers").select("*").eq("album_id", id).order("updated_at");
  const mine = (answers || []).find(x => x.user_id === me.id);
  shell(`<p><button class="ghost" id="back">بازگشت</button></p><h2>${esc(title)}</h2>
    <div class="box" style="margin-bottom:18px"><input type="file" id="file" accept="image/*">
    <textarea id="desc" rows="2" placeholder="توضیح (اختیاری)"></textarea>
    <button id="up">آپلود عکس</button> <span class="err" id="err"></span></div>
    <div class="feed">${photos.map(p => {
      const url = sb.storage.from("photos").getPublicUrl(p.path).data.publicUrl;
      return `<div class="photo"><div class="ph"><span class="av">${esc((p.uploader_name || "?")[0])}</span><b>${esc(p.uploader_name)}</b>
        ${me.is_admin || p.user_id === me.id ? `<button class="del" data-p="${p.id}" data-path="${esc(p.path)}">حذف</button>` : ""}</div>
        <img src="${url}" alt="" loading="lazy">
        ${p.description ? `<div class="cap"><b>${esc(p.uploader_name)}</b> ${esc(p.description)}</div>` : ""}</div>`;
    }).join("") || `<div class="empty">هنوز عکسی نیست. اولین نفر باش.</div>`}</div>
    <h2 style="margin-top:34px">جواب‌ها</h2>
    <div class="box" style="margin-bottom:18px">
      <div class="row"><input id="cnt" type="number" min="1" max="100" placeholder="تعداد سوال‌های امتحان" style="max-width:220px"><button id="mk" class="ghost">ساخت فرم</button></div>
      <div id="qs"></div><button id="save" hidden>ذخیره جواب‌های من</button>
    </div>
    <div class="grid">${(answers || []).map(x => `<div class="sheet"><b>${esc(x.user_name)}</b>
      ${me.is_admin || x.user_id === me.id ? `<button class="del" data-a="${x.id}">حذف</button>` : ""}
      ${x.items.map((t, i) => `<div>جواب سوال ${i + 1}: ${esc(t) || "—"}</div>`).join("")}</div>`).join("") || `<div class="empty">هنوز کسی جواب نگذاشته.</div>`}</div>`);
  const qs = document.getElementById("qs"), cnt = document.getElementById("cnt"), save = document.getElementById("save");
  const renderQs = (n, vals = []) => {
    qs.innerHTML = Array.from({ length: n }, (_, i) => `<label>سوال ${i + 1}</label><input data-q value="${esc(vals[i] || "")}">`).join("");
    save.hidden = false;
  };
  if (mine) { cnt.value = mine.items.length; renderQs(mine.items.length, mine.items); }
  document.getElementById("mk").onclick = () => {
    const n = Math.min(100, Math.max(1, +cnt.value || 0));
    if (!n) return;
    cnt.value = n;
    renderQs(n, [...qs.querySelectorAll("[data-q]")].map(i => i.value));
  };
  save.onclick = async () => {
    const items = [...qs.querySelectorAll("[data-q]")].map(i => i.value.trim());
    const r = await sb.from("answers").upsert({ album_id: id, user_id: me.id, user_name: me.name, items, updated_at: new Date().toISOString() }, { onConflict: "album_id,user_id" });
    if (r.error) return alert("خطا در ذخیره");
    photosView(id, title);
  };
  document.querySelectorAll("[data-a]").forEach(b => b.onclick = async () => {
    if (!confirm("این جواب‌ها حذف بشه؟")) return;
    await sb.from("answers").delete().eq("id", b.dataset.a);
    photosView(id, title);
  });
  document.getElementById("back").onclick = albumsView;
  document.querySelectorAll(".photo img").forEach(i => i.onclick = () => {
    const b = document.getElementById("big"); b.firstElementChild.src = i.src; b.style.display = "flex";
  });
  document.querySelectorAll("[data-p]").forEach(b => b.onclick = async () => {
    if (!confirm("این عکس حذف بشه؟")) return;
    await sb.storage.from("photos").remove([b.dataset.path]);
    await sb.from("photos").delete().eq("id", b.dataset.p);
    photosView(id, title);
  });
  document.getElementById("up").onclick = async () => {
    const f = document.getElementById("file").files[0], err = document.getElementById("err");
    if (!f) return err.textContent = "اول یه عکس انتخاب کن";
    err.textContent = "در حال آپلود...";
    const blob = await shrink(f);
    const path = `${id}/${me.id}-${Date.now()}.jpg`;
    const up = await sb.storage.from("photos").upload(path, blob, { contentType: "image/jpeg" });
    if (up.error) return err.textContent = "خطا در آپلود";
    await sb.from("photos").insert({ album_id: id, user_id: me.id, uploader_name: me.name, path, description: v("desc") });
    photosView(id, title);
  };
}

// kuchik kardan-e axa ta jaye zakhire kam masraf beshe
function shrink(file, max = 1600) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = img.width * s; c.height = img.height * s;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(res, "image/jpeg", 0.85);
    };
    img.src = URL.createObjectURL(file);
  });
}
init();
</script>
</body>
</html>
